name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on the same PR are pointless; never cancel main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features --locked

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  wasm:
    name: Check (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Type-check all wasm targets
        run: cargo check --lib --bins --target wasm32-unknown-unknown --all-features --locked

      # Mirror Trunk's exact feature set: the desktop-only bin is skipped, so
      # the cdylib artifact cannot collide with it under the same output name.
      - name: Type-check the Trunk web build
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features gui --locked

  windows:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Type-check all targets
        run: cargo check --all-targets --all-features --locked

  deploy:
    name: Deploy web app
    # Publish only after every check passes on a push to main. Pull requests
    # still run all checks, but never deploy.
    needs: [test, lint, wasm, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      # Prebuilt binary; `cargo install trunk --locked` wastes minutes here.
      - name: Install Trunk
        uses: taiki-e/install-action@trunk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build web app
        run: trunk build --release

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
