[package]
name = "r7crypto"
version = "0.4.0"
edition = "2021"
authors = ["rvoidex7"]
license = "MIT"
description = "Interactive cryptography workbench with pluggable entropy sources, quality testing and visualization"
repository = "https://github.com/rvoidex7/r7crypto"
keywords = ["cryptography", "entropy", "rng", "visualization", "nist"]
categories = ["cryptography", "visualization"]

[lib]
name = "r7crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Crypto
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
chacha20 = "0.10"

# Math & Stats
# 0.19 uses nalgebra 0.35, which no longer pulls the unmaintained `paste`
# crate (RUSTSEC-2024-0436).
statrs = "0.19"

# GUI (optional)
egui = { version = "0.37", optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "glow",
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
# Decodes the bundled PNG icon into RGBA for the window icon and header.
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
# The harness needs eframe's renderer even when the crate's own `gui` feature
# is off; otherwise the feature-matrix check fails inside egui_kittest.
eframe = { version = "0.37", default-features = false, features = ["glow"] }

# Web-only glue. Kept target-scoped so native builds stay free of JS shims.
# `getrandom/js` makes SystemEntropy use the browser CSPRNG on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "HtmlCanvasElement",
    "Window",
    "console",
] }

# Embeds assets/icons/icon.ico into the Windows executable. Build-time only and
# only when compiling for Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gui", "desktop"]
gui = ["dep:egui", "dep:eframe", "dep:image"]
# Only the native binary needs this. Trunk builds the web library with
# --no-default-features --features gui, so Cargo skips the bin target and the
# desktop/wasm artifacts cannot collide under the same output filename.
desktop = []

# Cargo's own manifest lints. Denying unused dependencies keeps the warning we
# saw on Windows from coming back as a silent warning; note that the lint can
# still miss a dependency that another crate also pulls in transitively.
[lints.cargo]
unused_dependencies = "deny"

[[bin]]
name = "r7crypto"
path = "src/main.rs"
required-features = ["gui", "desktop"]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "custom_source"
path = "examples/custom_source.rs"

[[example]]
name = "quality_check"
path = "examples/quality_check.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
